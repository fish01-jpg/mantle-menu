<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Project Sp1der</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23f59e0b' d='M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z'/></svg>">
<style>
  :root {
    --bg: #0f0823; --bg-2: #1a1032; --text: #f2ecff; --text-dim: #a29ec5;
    --primary: #a020f0; --accent: #7dd3fc; --glow: 0 0 14px rgba(160,32,240,.4);
    --font-mono: ui-monospace, "JetBrains Mono", "Fira Code", monospace;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin:0; padding:0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(ellipse at top, #1a1032 0%, #0f0823 60%);
    color: var(--text); min-height: 100vh; display:flex; flex-direction:column;
    touch-action: none;
  }
  header {
    padding: 14px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background: rgba(26,16,50,0.9); border-bottom:1px solid rgba(160,32,240,.35);
  }
  header .game-icon { width:36px; height:36px; border-radius:8px; background:var(--bg-2);
    display:grid; place-items:center; box-shadow: var(--glow); flex-shrink:0; }
  header .game-icon svg { width:20px; height:20px; fill: var(--text); }
  header h1 { font-size:1.05rem; font-weight:700; letter-spacing:.3px; }
  header .desc { font-size:.72rem; color:var(--text-dim); }
  header .actions { margin-left:auto; display:flex; gap:8px; }
  .btn {
    font-family: var(--font-mono); font-size:.72rem; background:var(--bg-2);
    color: var(--text); border:1px solid rgba(160,32,240,.5); border-radius:30px;
    padding:8px 14px; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center;
  }
  .btn:hover { border-color: var(--accent); box-shadow: var(--glow); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color:#fff; }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:16px; gap:14px; }
  .hud { display:flex; gap:12px; align-items:center; }
  .hud .box {
    background: var(--bg-2); border:1px solid rgba(160,32,240,.35); border-radius:8px;
    padding:6px 14px; text-align:center; font-family:var(--font-mono);
  }
  .hud .box .lbl { font-size:.6rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; }
  .hud .box .val { font-size:1.1rem; font-weight:700; color:var(--accent); }
  .board-wrap { position:relative; }
  #board {
    background: rgba(160,32,240,0.08); border-radius: var(--radius);
    padding: 10px; display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;
    width: min(92vw, 440px); aspect-ratio: 1;
    border: 1px solid rgba(160,32,240,.35); box-shadow: 0 4px 24px rgba(0,0,0,.5);
  }
  .cell {
    border-radius: 8px; display:grid; place-items:center;
    font-family: var(--font-mono); font-weight:800; position: relative;
    background: rgba(160,32,240,0.07); transition: none;
  }
  .tile {
    position:absolute; inset:0; border-radius:8px; display:grid; place-items:center;
    font-family: var(--font-mono); font-weight:800;
    transition: left 90ms ease, top 90ms ease;
  }
  .overlay {
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; background:rgba(15,8,35,.85); border-radius:var(--radius); text-align:center; padding:20px; z-index:5;
  }
  .overlay h2 { font-size:1.4rem; }
  .overlay p { color: var(--text-dim); font-size:.8rem; max-width:260px; }
  .hidden { display:none; }
  .hint { font-size:.7rem; color:var(--text-dim); text-align:center; }
  @media (max-width: 600px) { header { padding: 12px; } header .actions { margin-left:0; } }
</style>
</head>
<body>
  <header>
    <div class="game-icon"><svg viewBox="0 0 24 24"><path d="M4 4h6v6H4V4zm10 0h6v6h-6V4zM4 14h6v6H4v-6zm10 0h6v6h-6v-6z"/></svg></div>
    <div>
      <h1>2048</h1>
      <span class="desc">Join the tiles, get to 2048!</span>
    </div>
    <div class="actions">
      <a class="btn primary" href="Project-Sp1der-v4.5.4-fixed.html">← Sp1der hub</a>
      <button class="btn" id="newBtn">New game</button>
    </div>
  </header>
  <main>
    <div class="hud">
      <div class="box"><div class="lbl">Score</div><div class="val" id="score">0</div></div>
      <div class="box"><div class="lbl">Best</div><div class="val" id="best">0</div></div>
    </div>
    <div class="board-wrap">
      <div id="board"></div>
      <div class="overlay" id="startOverlay">
        <h2>2048</h2>
        <p>Use arrow keys or swipe to slide the tiles. When two tiles with the same number touch, they merge into one. Reach 2048!</p>
        <button class="btn primary" id="startBtn">Start game</button>
      </div>
      <div class="overlay hidden" id="overOverlay">
        <h2 id="overTitle">Game over</h2>
        <p id="overMsg"></p>
        <button class="btn primary" id="againBtn">Play again</button>
      </div>
    </div>
    <p class="hint">Arrow keys / WASD / swipe to slide</p>
  </main>
  <script>
  (function () {
    const COLORS = {
      2:'#eee4da', 4:'#ede0c8', 8:'#f2b179', 16:'#f59563', 32:'#f67c5f', 64:'#f65e3b',
      128:'#edcf72', 256:'#edcc61', 512:'#edc850', 1024:'#edc53f', 2048:'#edc22e',
      4096:'#3c3a32', 8192:'#3c3a32', 16384:'#3c3a32'
    };
    const TEXT_DARK = new Set([2,4]);
    const board = document.getElementById('board');
    const $score = document.getElementById('score');
    const $best = document.getElementById('best');
    const $start = document.getElementById('startOverlay');
    const $over = document.getElementById('overOverlay');
    const $overTitle = document.getElementById('overTitle');
    const $overMsg = document.getElementById('overMsg');
    let grid, score, best = 0, started, over, tileEls = new Map(), tileId = 0;

    // background cells
    for (let i=0;i<16;i++) {
      const c = document.createElement('div');
      c.className = 'cell';
      board.appendChild(c);
    }

    function reset() {
      grid = [[null,null,null,null],[null,null,null,null],[null,null,null,null],[null,null,null,null]];
      score = 0; over = false;
      $score.textContent = '0';
      // clear tiles
      board.querySelectorAll('.tile').forEach(t => t.remove());
      tileEls.clear();
      addRandom(); addRandom();
      render();
    }
    function addRandom() {
      const empties = [];
      for (let r=0;r<4;r++) for (let c=0;c<4;c++) if (!grid[r][c]) empties.push([r,c]);
      if (!empties.length) return;
      const [r,c] = empties[Math.floor(Math.random()*empties.length)];
      grid[r][c] = { id: ++tileId, v: Math.random()<0.9 ? 2 : 4, r, c };
    }
    function render() {
      for (const t of tileEls.values()) t.el.remove();
      tileEls.clear();
      const cw = board.clientWidth / 4 - (10*3/4); // approximate cell size with gaps
      // We'll position with percentages — simpler and robust
      for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
        const t = grid[r][c];
        if (!t) continue;
        const el = document.createElement('div');
        el.className = 'tile';
        el.textContent = t.v;
        const bg = COLORS[t.v] || '#3c3a32';
        el.style.background = bg;
        el.style.color = TEXT_DARK.has(t.v) ? '#776e65' : '#f9f6f2';
        el.style.fontSize = t.v >= 1024 ? '1.4rem' : t.v >= 128 ? '1.7rem' : '2rem';
        if (t.v >= 128) { el.style.boxShadow = '0 0 12px ' + bg + '66'; }
        positionTile(el, r, c);
        board.appendChild(el);
        tileEls.set(t.id, { el, r, c });
      }
    }
    function positionTile(el, r, c) {
      const gap = 10, pad = 10;
      const size = (board.clientWidth - pad*2 - gap*3) / 4;
      el.style.width = size + 'px';
      el.style.height = size + 'px';
      el.style.left = (pad + c*(size+gap)) + 'px';
      el.style.top = (pad + r*(size+gap)) + 'px';
    }
    // Slide logic: returns true if anything moved
    function slide(dir) {
      let moved = false;
      const order = dir === 'left' ? [0,1,2,3] : dir === 'right' ? [3,2,1,0] : [0,1,2,3];
      const rows = dir === 'up' || dir === 'down';
      for (let i of order) {
        // extract line
        let line = [];
        for (let j=0;j<4;j++) {
          const r = rows ? j : i, c = rows ? i : j;
          if (grid[r][c]) line.push(grid[r][c]);
        }
        // merge
        const merged = [];
        let m = 0;
        while (m < line.length) {
          if (m+1 < line.length && line[m].v === line[m+1].v) {
            const nv = line[m].v * 2;
            score += nv;
            merged.push({ id: line[m].id, v: nv, merged: true });
            m += 2;
          } else {
            merged.push({ ...line[m] });
            m++;
          }
        }
        while (merged.length < 4) merged.push(null);
        // write back
        for (let j=0;j<4;j++) {
          const r = rows ? j : i, c = rows ? i : j;
          const t = merged[j];
          if (t) { t.r = r; t.c = c; }
          if (grid[r][c] !== t) moved = true;
          grid[r][c] = t;
        }
      }
      if (moved) {
        $score.textContent = score;
        if (score > best) { best = score; $best.textContent = best; }
      }
      return moved;
    }
    function canMove() {
      for (let r=0;r<4;r++) for (let c=0;c<4;c++) {
        if (!grid[r][c]) return true;
        const v = grid[r][c].v;
        if (c<3 && grid[r][c+1] && grid[r][c+1].v === v) return true;
        if (r<3 && grid[r+1][c] && grid[r+1][c].v === v) return true;
      }
      return false;
    }
    function move(dir) {
      if (over || !started) return;
      const moved = slide(dir);
      if (moved) {
        addRandom();
        render();
        if (grid.flat().some(t => t && t.v >= 2048)) {
          over = true;
          $overTitle.textContent = 'You win!';
          $overMsg.textContent = 'You reached 2048 — score ' + score + '.';
          $over.classList.remove('hidden');
        } else if (!canMove()) {
          over = true;
          $overTitle.textContent = 'Game over';
          $overMsg.textContent = 'No more moves — final score ' + score + '.';
          $over.classList.remove('hidden');
        }
      }
    }
    document.getElementById('startBtn').onclick = () => { $start.classList.add('hidden'); reset(); started = true; };
    document.getElementById('againBtn').onclick = () => { $over.classList.add('hidden'); reset(); started = true; };
    document.getElementById('newBtn').onclick = () => { $over.classList.add('hidden'); reset(); started = true; };

    const keyDirs = {
      ArrowLeft:'left', ArrowRight:'right', ArrowUp:'up', ArrowDown:'down',
      KeyA:'left', KeyD:'right', KeyW:'up', KeyS:'down'
    };
    document.addEventListener('keydown', e => {
      if (keyDirs[e.code]) {
        e.preventDefault();
        if (!started) { document.getElementById('startBtn').click(); return; }
        move(keyDirs[e.code]);
      }
    });
    // swipe
    let tsx=0, tsy=0;
    const swipeArea = document.querySelector('main');
    swipeArea.addEventListener('touchstart', e => { const t=e.touches[0]; tsx=t.clientX; tsy=t.clientY; }, {passive:true});
    swipeArea.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      const dx = t.clientX - tsx, dy = t.clientY - tsy;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (!started) { document.getElementById('startBtn').click(); return; }
      if (Math.abs(dx) > Math.abs(dy)) move(dx>0?'right':'left'); else move(dy>0?'down':'up');
    }, {passive:true});
    window.addEventListener('resize', render);

    reset(); started = false;
  })();
  </script>
</body>
</html>
